spring.application.name=ms-ventas
server.port=8083

# Conexión a MySQL (la base de datos se crea automáticamente si no existe)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ventas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# URLs de los microservicios con los que se comunica (REST síncrono)
servicios.productos.url=${PRODUCTOS_URL:http://localhost:8082}
servicios.inventario.url=${INVENTARIO_URL:http://localhost:8084}
